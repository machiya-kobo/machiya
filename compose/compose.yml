# Machiya reference compose: the engines (Hister, SearXNG) and the rooms Kura, Niwa and Konbini on one machine, in any
# combination, with no Tailscale. Shiori is a client and is not in it (see its README).
#
#   ./demo-init                       # the sample vault + a .env for this machine (or: cp .env.example .env and edit it)
#   docker compose up -d --build --wait
#
# `docker compose` works the same as `podman compose`. Profiles choose what runs (COMPOSE_PROFILES in .env, or
# --profile on the command line): engines (hister, searxng + valkey), kura, niwa, konbini, smallweb, mcp, code (code-import: your repos for
# Shiori's Code view), and proxy (an optional SOCKS5
# egress proxy for SearXNG, off by default; see the `proxy` service below and config/searxng/settings.yml).
# Ports: every published port is a variable (HISTER_PORT, SEARXNG_PORT, KURA_PORT, NIWA_PORT, NIWA_GEMINI_PORT, NIWA_GOPHER_PORT,
# KONBINI_PORT, SMALLWEB_PORT, MCP_PORT) for when one is taken; change the matching *_PUBLIC_URL and MACHIYA_ROOMS with it.
# Services find each other by URL settings only (docs/principles.md): leave one out and the feature that needs it
# switches off. The rooms build from their own repositories, checked out next to this one (../../kura etc.).
#
# Who may use the apps: AUTH defaults to `open` (no identity check), which is only safe because every published port
# binds 127.0.0.1. To let other people in, put `tailscale serve` in front, set KURA_AUTH/NIWA_AUTH/KONBINI_AUTH=tailscale,
# list the logins in KURA_USERS/NIWA_USERS/KONBINI_USERS and name the proxy's address in *_TRUSTED_PROXIES
# (docs/install/remote-access.md). One vault copy for the whole stack: add mirror.yml (see it).
# Identity (optional, off by default): people, agents and sign-in from one identity file. Set MACHIYA_IDENTITY_DIR and
# MACHIYA_IDENTITY_FILE in .env; the directory is mounted read-only at the same path. See docs/identity.md.
name: machiya

x-room: &room
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 1024
  init: true                                         # the rooms run git
  user: "${MACHIYA_UID:-1000}:${MACHIYA_GID:-1000}"  # your own ids (demo-init writes them), so the mounted folders stay yours
  userns_mode: ${MACHIYA_USERNS:-}                   # rootless podman only: keep-id (demo-init sets it); empty for Docker

services:
  # -- engines -----------------------------------------------------------------------------------
  hister:
    profiles: [engines]
    image: ghcr.io/asciimoo/hister:v0.20.0          # pinned: pre-1.0, breaking releases
    user: "${MACHIYA_UID:-1000}:${MACHIYA_GID:-1000}"   # so ./data/hister stays yours (the image's own user is 65532)
    userns_mode: ${MACHIYA_USERNS:-}
    environment:
      - HISTER__SERVER__BASE_URL=${HISTER_PUBLIC_URL:-http://localhost:4433}
      - HISTER__APP__SEARCH_URL=${SEARXNG_PUBLIC_URL:-http://localhost:8888}/search?q={query}
    volumes:
      - ../config/hister/config.yml:/hister/config.yml:ro
      - ${HISTER_DATA:-./data/hister}:/hister/data
    ports: ["127.0.0.1:${HISTER_PORT:-4433}:4433"]
    restart: unless-stopped

  searxng:
    profiles: [engines]
    image: searxng/searxng:2026.9.25-12f8b6515      # pinned; check the JSON image-proxy plugin after a bump
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      - SEARXNG_BASE_URL=${SEARXNG_PUBLIC_URL:-http://localhost:8888}/
    volumes:
      - ../config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ../config/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - ../config/searxng/plugins/image_proxy_json.py:/usr/local/searxng/searx/plugins/image_proxy_json.py:ro
    ports: ["127.0.0.1:${SEARXNG_PORT:-8888}:8080"]
    depends_on: [valkey]
    restart: unless-stopped

  valkey:                                           # SearXNG's limiter store
    profiles: [engines]
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped

  proxy:                                            # OPTIONAL SOCKS5 egress for SearXNG; not started unless you add --profile proxy
    profiles: [proxy]
    # One example of a SOCKS5 proxy (it tunnels through a hosted VPN-style account). Any SOCKS5 proxy listening on :1080 on this
    # network works instead. To use one: uncomment `outgoing.proxies` in config/searxng/settings.yml and start with
    #   docker compose --profile engines --profile proxy up -d
    image: caomingjun/warp
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ${PROXY_DATA:-./data/proxy}:/var/lib/cloudflare-warp
    restart: unless-stopped

  # -- Machiya -----------------------------------------------------------------------------------
  # The vault: VAULT_REPO_URL (https, ssh or file://). With a file:// URL the repository's folder is mounted into the
  # containers at the same absolute path (VAULT_GIT; the demo's bare repository), so `git` inside finds it.
  kura:
    profiles: [kura]
    <<: *room
    build: ${KURA_SRC:-../../kura}/app
    environment:
      - KURA_AUTH=${KURA_AUTH:-open}
      - KURA_USERS=${KURA_USERS:-}
      - MACHIYA_IDENTITY_FILE=${MACHIYA_IDENTITY_FILE:-}       # docs/identity.md; empty = off
      - KURA_SIGNIN=${KURA_SIGNIN:-}
      - KURA_AUTH_HEADER=${KURA_AUTH_HEADER:-}
      - KURA_BIND_BEHIND_PROXY=${KURA_BIND_BEHIND_PROXY:-}
      - KURA_TRUSTED_PROXIES=${KURA_TRUSTED_PROXIES:-}   # tailscale mode: the peer tailscale serve's connections come from (docs/install/remote-access.md)
      - KURA_REPO_URL=${VAULT_REPO_URL:-}
      - KURA_REPO_SUBDIR=${VAULT_SUBDIR:-}
      - KURA_REPO_USER=${VAULT_REPO_USER:-}
      - KURA_REPO_TOKEN_FILE=${VAULT_TOKEN_FILE:+/secrets/vault-token}
      - KURA_PUBLIC_URL=${KURA_PUBLIC_URL:-http://localhost:8083}
      - KURA_NIWA_URL=${NIWA_PUBLIC_URL:-}
      - KURA_KONBINI_URL=${KONBINI_PUBLIC_URL:-}
      - KURA_HISTER_URL=${KURA_HISTER_URL:-}         # e.g. http://hister:4433 to push the notes into Hister
      - MACHIYA_ROOMS=${MACHIYA_ROOMS:-}
      - MACHIYA_SOURCE_URL=${MACHIYA_SOURCE_URL:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ${KURA_DATA:-./data/kura}:/data
      - ${VAULT_TOKEN_FILE:-/dev/null}:/secrets/vault-token:ro
      - ${VAULT_GIT:-/dev/null}:${VAULT_GIT:-/vault-git-unused}:ro
      - ${MACHIYA_IDENTITY_DIR:-/dev/null}:${MACHIYA_IDENTITY_DIR:-/identity-unused}:ro
    depends_on:
      hister: {condition: service_started, required: false}      # push the notes only once Hister is up (if it is in the stack)
    ports: ["127.0.0.1:${KURA_PORT:-8083}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/status', timeout=4)\""]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 60s
      disable: ${MACHIYA_NO_HEALTHCHECK:-false}      # podman: its healthchecks can't run in rootless containers (demo-init sets it)
    restart: unless-stopped

  niwa:
    profiles: [niwa]
    <<: *room
    build: ${NIWA_SRC:-../../niwa}/app
    environment:
      - NIWA_AUTH=${NIWA_AUTH:-open}
      - NIWA_USERS=${NIWA_USERS:-}
      - MACHIYA_IDENTITY_FILE=${MACHIYA_IDENTITY_FILE:-}
      - NIWA_SIGNIN=${NIWA_SIGNIN:-}
      - NIWA_AUTH_HEADER=${NIWA_AUTH_HEADER:-}
      - NIWA_BIND_BEHIND_PROXY=${NIWA_BIND_BEHIND_PROXY:-}
      - NIWA_TRUSTED_PROXIES=${NIWA_TRUSTED_PROXIES:-}
      - NIWA_PUBLIC_URL=${NIWA_PUBLIC_URL:-http://localhost:8082}   # its web address (the sign-in's origin over http)
      - NIWA_HOST=${NIWA_HOST:-localhost}            # the name in the gemini certificate and the gopher menus
      - NIWA_REPO_URL=${VAULT_REPO_URL:-}            # it pushes the garden's fields here: needs write access
      - NIWA_REPO_SUBDIR=${VAULT_SUBDIR:-}
      - NIWA_KURA_URL=${KURA_PUBLIC_URL:-http://localhost:8083}
      - NIWA_KONBINI_URL=${KONBINI_PUBLIC_URL:-http://localhost:8081}   # the address of browser links
      - NIWA_KONBINI_API_URL=${KONBINI_INTERNAL_URL:-http://konbini:8081}   # the address Niwa itself calls Konbini on
      - NIWA_GOPHER_PUBLIC_PORT=${NIWA_GOPHER_PORT:-7070}                 # the port gopher menus advertise
      - MACHIYA_ROOMS=${MACHIYA_ROOMS:-}
      - MACHIYA_SOURCE_URL=${MACHIYA_SOURCE_URL:-}
      - NIWA_ARCHIVE=${NIWA_ARCHIVE:-none}
      - TZ=${TZ:-UTC}
    volumes:
      - ${NIWA_DATA:-./data/niwa}:/data
      - ${VAULT_GIT:-/dev/null}:${VAULT_GIT:-/vault-git-unused}
      - ${MACHIYA_IDENTITY_DIR:-/dev/null}:${MACHIYA_IDENTITY_DIR:-/identity-unused}:ro
    ports:
      - "127.0.0.1:${NIWA_PORT:-8082}:8080"                       # the web garden
      - "127.0.0.1:${NIWA_GEMINI_PORT:-1965}:1965"                       # gemini
      - "127.0.0.1:${NIWA_GOPHER_PORT:-7070}:7070"                       # gopher
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/status', timeout=4)\""]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 90s
      disable: ${MACHIYA_NO_HEALTHCHECK:-false}
    restart: unless-stopped

  konbini:
    profiles: [konbini]
    <<: *room
    build: ${KONBINI_SRC:-../../konbini}/app
    environment:
      - KANBAN_AUTH=${KONBINI_AUTH:-open}
      - KANBAN_ALLOWED_HOSTS=konbini                 # open mode answers only known names: Niwa calls http://konbini:8081
      - KANBAN_TAILNET_USERS=${KONBINI_USERS:-}
      - MACHIYA_IDENTITY_FILE=${MACHIYA_IDENTITY_FILE:-}
      - KANBAN_SIGNIN=${KONBINI_SIGNIN:-}
      - KANBAN_AUTH_HEADER=${KONBINI_AUTH_HEADER:-}
      - KANBAN_BIND_BEHIND_PROXY=${KONBINI_BIND_BEHIND_PROXY:-}
      - KANBAN_TRUSTED_PROXIES=${KONBINI_TRUSTED_PROXIES:-}
      - KANBAN_REPO=/repo                            # its own read-write clone of the vault (demo-init makes it)
      - KANBAN_DB=/data/kanban.sqlite3
      - KANBAN_REPO_SUBDIR=${VAULT_SUBDIR:-}
      - KANBAN_BOARD_URL=${KONBINI_PUBLIC_URL:-http://localhost:8081}
      - KANBAN_KURA_URL=${KURA_PUBLIC_URL:-}
      - KANBAN_NIWA_URL=${NIWA_PUBLIC_URL:-}
      - KANBAN_HISTER_URL=${KONBINI_HISTER_URL:-}
      - KANBAN_ARCHIVE=${KONBINI_ARCHIVE:-none}
      - MACHIYA_ROOMS=${MACHIYA_ROOMS:-}
      - MACHIYA_SOURCE_URL=${MACHIYA_SOURCE_URL:-}
      - HOME=/data
      - TZ=${TZ:-UTC}
    volumes:
      - ${KONBINI_DATA:-./data/konbini}:/data
      - ${KONBINI_REPO:-./data/konbini-repo}:/repo
      - ${VAULT_GIT:-/dev/null}:${VAULT_GIT:-/vault-git-unused}      # the clone's origin, so the board can push
      - ${MACHIYA_IDENTITY_DIR:-/dev/null}:${MACHIYA_IDENTITY_DIR:-/identity-unused}:ro
    ports: ["127.0.0.1:${KONBINI_PORT:-8081}:8081"]
    restart: unless-stopped

  # -- the stack's tools: smallweb and machiya-mcp ------------------------------------------------
  # Each on a network of its OWN (the owner's rule, 2026-10-05: sweep MACH-M-5, MACH-F-9), plus `default` only to reach
  # Hister, the rooms and the proxy. Both trust a Tailscale-User-Login header in `tailscale` mode, so the header must
  # come from the proxy alone: put the Tailscale sidecar on the tool's network at the fixed address below and name it
  # in *_TRUSTED_PROXIES (any other container's header then counts for nothing). In the default `open` mode the
  # published port binds 127.0.0.1 and nobody else reaches it.
  smallweb:
    profiles: [smallweb]
    <<: *room
    build: ../stack/smallweb
    environment:
      - SMALLWEB_AUTH=${SMALLWEB_AUTH:-open}
      - SMALLWEB_USERS=${SMALLWEB_USERS:-}
      - SMALLWEB_TRUSTED_PROXIES=${SMALLWEB_TRUSTED_PROXIES:-}   # tailscale mode: the sidecar, 172.31.250.2/32
      - SMALLWEB_PUBLIC_URL=${SMALLWEB_PUBLIC_URL:-http://localhost:8090}
      - SMALLWEB_HISTER_URL=${SMALLWEB_HISTER_URL:-}             # e.g. http://hister:4433: pages read are saved there
      - SMALLWEB_SOCKS=${SMALLWEB_SOCKS:-}                       # e.g. socks5h://proxy:1080 (the proxy profile)
      - TZ=${TZ:-UTC}
    volumes:
      - ${SMALLWEB_DATA:-./data/smallweb}:/data
    networks:                                     # pinned: a dynamic address could take .2 (the sidecar's) first on a restart
      smallweb: {ipv4_address: 172.31.250.3}
      default: {}
    ports: ["127.0.0.1:${SMALLWEB_PORT:-8090}:8080"]
    mem_limit: 128m
    restart: unless-stopped

  machiya-mcp:
    profiles: [mcp]
    <<: *room
    build: ../stack/mcp
    environment:
      - MCP_AUTH=${MCP_AUTH:-open}
      - MCP_USERS=${MCP_USERS:-}
      - MCP_TRUSTED_PROXIES=${MCP_TRUSTED_PROXIES:-}             # tailscale mode: the sidecar, 172.31.250.10/32
      - KURA_URL=${MCP_KURA_URL:-http://kura:8080}
      - KONBINI_URL=${MCP_KONBINI_URL:-http://konbini:8081}
      - NIWA_URL=${MCP_NIWA_URL:-http://niwa:8080}
      - HISTER_URL=${MCP_HISTER_URL:-http://hister:4433}
      - HOME=/data
      - TZ=${TZ:-UTC}
    volumes:
      - ${MCP_DATA:-./data/mcp}:/data
    networks:                                     # pinned: a dynamic address could take .10 (the sidecar's) first on a restart
      machiya-mcp: {ipv4_address: 172.31.250.11}
      default: {}
    ports: ["127.0.0.1:${MCP_PORT:-8091}:8080"]
    mem_limit: 256m
    restart: unless-stopped

  code-import:                                      # your Forgejo and GitHub repos into Hister: Shiori's Code view (docs/services/code-import.md)
    profiles: [code]
    <<: *room
    build: {context: .., dockerfile: stack/code-import/Dockerfile}
    environment:
      - CODE_IMPORT_FORGEJO_URL=${CODE_IMPORT_FORGEJO_URL:-}               # e.g. https://forgejo.example.com; empty: no Forgejo
      - CODE_IMPORT_FORGEJO_OWNERS=${CODE_IMPORT_FORGEJO_OWNERS:-}         # you,your-org
      - CODE_IMPORT_FORGEJO_TOKEN_FILE=${CODE_IMPORT_FORGEJO_TOKEN_FILE:-} # e.g. /secrets/forgejo-token (a file in CODE_IMPORT_SECRETS_DIR)
      - CODE_IMPORT_GITHUB_TOKEN_FILES=${CODE_IMPORT_GITHUB_TOKEN_FILES:-} # you=/secrets/github-you-token,your-org=/secrets/github-org-token
      - CODE_IMPORT_TWINS=${CODE_IMPORT_TWINS:-}
      - CODE_IMPORT_EXCLUDE=${CODE_IMPORT_EXCLUDE:-}                       # repos that must never reach Hister: your vault, a password store
      - CODE_IMPORT_HISTER_URL=${CODE_IMPORT_HISTER_URL:-http://hister:4433}
      - CODE_IMPORT_HISTER_TOKEN_FILE=${CODE_IMPORT_HISTER_TOKEN_FILE:-}   # only when Hister has an access token
      - CODE_IMPORT_DATA=/data
      - TZ=${TZ:-UTC}
    volumes:
      - ${CODE_IMPORT_DATA:-./data/code-import}:/data
      - ${CODE_IMPORT_SECRETS_DIR:-./secrets}:/secrets:ro                  # the token files, one per line-1 token; never in .env
    mem_limit: 256m
    restart: unless-stopped

  # -- Shiori's companions: shiori-feed and shiori-ai (profile `shiori`) ------------------------------
  # Subscribe feeds of any Hister search, and Summarize and AI Answer for Shiori's hosted pages
  # (docs/services/shiori-feed.md, docs/services/shiori-ai.md). Each has a gate of its own: in the default `open` mode
  # the published port binds 127.0.0.1 and *_BIND_BEHIND_PROXY=1 says so. Behind a proxy that signs people in, set
  # *_AUTH=proxy and the proxy's address in *_TRUSTED_PROXIES; behind a Tailscale sidecar, *_AUTH=tailscale, *_USERS
  # and the sidecar's address. Secrets are files in SHIORI_SECRETS_DIR, mounted at /secrets.
  shiori-feed:
    profiles: [shiori]
    <<: *room
    build: ../stack/shiori-feed
    environment:
      - SHIORI_FEED_AUTH=${SHIORI_FEED_AUTH:-open}
      - SHIORI_FEED_BIND_BEHIND_PROXY=${SHIORI_FEED_BIND_BEHIND_PROXY:-1}
      - SHIORI_FEED_USERS=${SHIORI_FEED_USERS:-}
      - SHIORI_FEED_TRUSTED_PROXIES=${SHIORI_FEED_TRUSTED_PROXIES:-}
      - SHIORI_FEED_HISTER_URL=${SHIORI_FEED_HISTER_URL:-http://hister:4433}
      - SHIORI_FEED_HISTER_TOKEN_FILE=${SHIORI_HISTER_TOKEN_FILE:-}       # e.g. /secrets/hister-token; only when Hister has users
      - SHIORI_FEED_HISTER_PUBLIC_URL=${HISTER_PUBLIC_URL:-http://localhost:4433}
      - TZ=${TZ:-UTC}
    volumes:
      - ${SHIORI_SECRETS_DIR:-./secrets}:/secrets:ro
    read_only: true
    ports: ["127.0.0.1:${SHIORI_FEED_PORT:-8092}:8080"]
    mem_limit: 64m
    restart: unless-stopped

  shiori-ai:
    profiles: [shiori]
    <<: *room
    build: ../stack/shiori-ai
    environment:
      - SHIORI_AI_AUTH=${SHIORI_AI_AUTH:-open}
      - SHIORI_AI_BIND_BEHIND_PROXY=${SHIORI_AI_BIND_BEHIND_PROXY:-1}
      - SHIORI_AI_USERS=${SHIORI_AI_USERS:-}
      - SHIORI_AI_TRUSTED_PROXIES=${SHIORI_AI_TRUSTED_PROXIES:-}
      - SHIORI_AI_KEY_FILE=${SHIORI_AI_KEY_FILE:-}                         # e.g. /secrets/anthropic-api-key; empty = AI off
      - SHIORI_AI_MODEL=${SHIORI_AI_MODEL:-claude-sonnet-5-5}
      - SHIORI_AI_DAILY_REQUESTS=${SHIORI_AI_DAILY_REQUESTS:-100}
      - SHIORI_AI_DAILY_INPUT_TOKENS=${SHIORI_AI_DAILY_INPUT_TOKENS:-2000000}
      - SHIORI_AI_HISTER_URL=${SHIORI_AI_HISTER_URL:-http://hister:4433}   # summaries; empty = off
      - SHIORI_AI_HISTER_TOKEN_FILE=${SHIORI_HISTER_TOKEN_FILE:-}
      - SHIORI_AI_SEARXNG_URL=${SHIORI_AI_SEARXNG_URL:-http://searxng:8080}   # answers; empty = off
      - TZ=${TZ:-UTC}
    volumes:
      - ${SHIORI_AI_DATA:-./data/shiori-ai}:/data
      - ${SHIORI_SECRETS_DIR:-./secrets}:/secrets:ro
    read_only: true
    ports: ["127.0.0.1:${SHIORI_AI_PORT:-8093}:8080"]
    mem_limit: 128m
    restart: unless-stopped

networks:
  default: {}
  smallweb:                                         # smallweb (.3) and its proxy only; .2 is the sidecar's: pin every member
    ipam: {config: [{subnet: 172.31.250.0/29}]}
  machiya-mcp:                                      # machiya-mcp (.11) and its proxy only; .10 is the sidecar's: pin every member
    ipam: {config: [{subnet: 172.31.250.8/29}]}
