# The dev stack's Hister (v0.20.0): users on, the stub OIDC provider, no secrets here. Settings that depend on the dev
# host come from the environment (HISTER__SERVER__BASE_URL, HISTER__APP__SEARCH_URL); the OIDC client secret from the
# env file dev init writes under $DEV_DATA/secrets (HISTER__SERVER__OAUTH__OIDC__CLIENT_SECRET). Dev only.
app:
  title: Hister (dev)
  user_handling: true
  public: false
  redirect_on_no_results: false
  open_results_on_new_tab: false
  log_level: warning            # no search text in the log (as production, 2026-10-05)
server:
  address: 0.0.0.0:4433
  database: db.sqlite3
  max_batch_body_size: 40
  metrics: false
  oauth_only: false
  oauth:
    oidc:
      client_id: hister
      configuration_url: http://stub-idp:9000/.well-known/openid-configuration
indexer:
  detect_languages: false       # the synthetic corpus is English; saves a slow first start
  directories: []
crawler:
  backend: http
  timeout: 10
  delay: 0
extractors:
  twitter:
    enable: false
  mastodon:
    enable: false
  bluesky:
    enable: false
