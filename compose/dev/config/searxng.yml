# The dev stack's SearXNG: a tiny engine set (web results are sparse on purpose), JSON on, no limiter (so no valkey).
# The secret comes from SEARXNG_SECRET (dev init generates it). Dev only.
use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - wiktionary
      - duckduckgo
general:
  debug: false
  instance_name: "SearXNG (dev)"
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  limiter: false
  image_proxy: false
  public_instance: false
  port: 8080
  bind_address: "0.0.0.0"
ui:
  query_in_title: false
  default_theme: simple
outgoing:
  request_timeout: 4.0
