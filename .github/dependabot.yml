# Version updates for the pinned GitHub Actions. Dependabot only opens PRs; merging one means pulling it onto main
# like any other commit (tests green first).
# Not covered: the Dockerfile base images (public.ecr.aws answers Dependabot's shared runners with 429, so its docker
# job fails; tools/pin-bases keeps those digests current instead) and the inline pip pins (not visible to it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "machiya: "
    groups:
      actions:
        patterns: ["*"]
