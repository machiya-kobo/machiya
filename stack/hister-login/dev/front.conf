# The dev stack's front door: TLS for *.machiya.test on one port, standing in for Tailscale Serve (hister.*, the rooms,
# idp.*) and for shiori-web's nginx (shiori.*, with the design's auth_request). Dev only.
ssl_certificate     /certs/tls.crt;
ssl_certificate_key /certs/tls.key;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
proxy_http_version 1.1;
resolver 10.89.77.1 valid=5s ipv6=off;   # podman's network DNS: containers restarted mid-test get new addresses

# hister.*: Serve sends /machiya/ and the one callback path to the helper, the rest to Hister
server {
    listen 8443 ssl;
    server_name hister.machiya.test;
    set $helper http://hister-login:8080;
    set $hister http://hister:4433;
    location /machiya/ { proxy_pass $helper; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location = /api/oauth/callback { proxy_pass $helper; proxy_set_header Host $host; }
    location / {
        proxy_pass $hister; proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    }
}

server { listen 8443 ssl; server_name kura.machiya.test;    set $u http://room-kura:8000;    location / { proxy_pass $u; proxy_set_header Host $host; } }
server { listen 8443 ssl; server_name niwa.machiya.test;    set $u http://room-niwa:8000;    location / { proxy_pass $u; proxy_set_header Host $host; } }
server { listen 8443 ssl; server_name konbini.machiya.test; set $u http://room-konbini:8000; location / { proxy_pass $u; proxy_set_header Host $host; } }
server { listen 8443 ssl; server_name idp.machiya.test;     set $u http://stub-idp:9000;     location / { proxy_pass $u; proxy_set_header Host $host; } }

# shiori.*: the hosted pages' nginx (design §6): Hister behind auth_request, the browser's Cookie header replaced by the
# mapped Hister session; /kura/ gets machiya_sso only. A 401 goes to the helper's sign-in (the pages do it in JS).
server {
    listen 8443 ssl;
    server_name shiori.machiya.test;
    set $helper_internal http://hister-login:8081;
    set $hister http://hister:4433;
    set $kura http://room-kura:8000;
    location = /_machiya_auth {
        internal;
        proxy_pass $helper_internal/v1/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Machiya-Session $cookie_machiya_sso;
    }
    location @signin {
        return 302 https://hister.machiya.test:19043/machiya/signin?return=https://shiori.machiya.test:19043$request_uri;
    }
    location /kura/ {
        rewrite ^/kura(/.*)$ $1 break;
        proxy_pass $kura;
        proxy_set_header Host kura.machiya.test;
        proxy_set_header Cookie "machiya_sso=$cookie_machiya_sso";
    }
    location / {
        auth_request /_machiya_auth;
        auth_request_set $hister_cookie $upstream_http_x_hister_cookie;
        error_page 401 = @signin;
        proxy_set_header Cookie $hister_cookie;
        # Hister re-sends its session cookie on every signed-in answer (the sliding expiry): without this the raw
        # Hister session would land in the browser as a host-only cookie on shiori.* (found in gate 0)
        proxy_hide_header Set-Cookie;
        proxy_set_header Host $host;
        proxy_pass $hister;
    }
}
