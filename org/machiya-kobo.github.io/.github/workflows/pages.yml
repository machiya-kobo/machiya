# Publishes the Machiya marketing page (machiya-kobo/machiya, site/) at https://machiya-kobo.github.io/.
# The page's source stays in the machiya repo; this repo only deploys it. Runs every six hours and on demand
# (Actions -> pages -> Run workflow) after a change to site/.
name: pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [site]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          repository: machiya-kobo/machiya
          sparse-checkout: site
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
